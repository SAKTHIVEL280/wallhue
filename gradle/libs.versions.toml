[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "bom" }
material3 = { module = "androidx.compose.material3:material3", version = "1.5.0-rc01" }
icons = { module = "androidx.compose.material:material-icons-extended" }
ui = { module = "androidx.compose.ui:ui" }
